<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Secret d'Amour - 14 Février</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #b33951;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #7a2c40;
            font-weight: 300;
        }

        .locked-frame {
            background-color: rgba(255, 255, 255, 0.97);
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(179, 57, 81, 0.35);
            border: 12px solid #f8d7da;
            position: relative;
            margin-bottom: 30px;
            transition: all 0.8s ease;
            backdrop-filter: blur(5px);
        }

        .frame-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            font-size: 3rem;
            color: #b33951;
            margin-right: 20px;
            animation: pulse 2s infinite;
        }

        .frame-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #b33951;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        .couple-name {
            font-size: 1.8rem;
            color: #ff7b9c;
            margin-bottom: 25px;
            font-weight: 700;
            font-family: 'Dancing Script', cursive;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .password-section {
            margin-bottom: 25px;
        }

        .password-label {
            display: block;
            font-size: 1.3rem;
            color: #7a2c40;
            margin-bottom: 20px;
        }

        .password-input {
            width: 350px;
            padding: 18px 25px;
            border: 3px solid #f8d7da;
            border-radius: 60px;
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.3s;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .password-input:focus {
            outline: none;
            border-color: #b33951;
            box-shadow: 0 0 20px rgba(179, 57, 81, 0.3);
            transform: scale(1.02);
        }

        .unlock-btn {
            background: linear-gradient(to right, #b33951, #ff7b9c);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(179, 57, 81, 0.5);
            display: inline-block;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .unlock-btn:hover:not(:disabled) {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(179, 57, 81, 0.6);
        }

        .unlock-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .unlocked-container {
            display: none;
            margin-top: 40px;
            animation: fadeInUp 1.2s ease;
        }

        .unlocked-container.active {
            display: block;
        }

        .message-area {
            background-color: white;
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(179, 57, 81, 0.25);
            border: 10px solid #f8d7da;
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .message-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .message-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #b33951;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .message-content-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        @media (max-width: 1100px) {
            .message-content-wrapper {
                flex-direction: column;
                gap: 30px;
            }
        }

        .heart-photo-frame {
            width: 250px;
            height: 250px;
            position: relative;
            animation: floatHeart 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        .heart-photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 5px solid white;
        }

        .message-content-area {
            flex: 1;
            max-width: 600px;
            padding: 30px;
            background: linear-gradient(135deg, #fff5f7, #ffeef1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 3px solid #ffd1dc;
            position: relative;
            overflow: hidden;
        }

        .message-content {
            font-size: 1.4rem;
            line-height: 1.9;
            color: #5a3a3a;
            font-family: 'Playfair Display', serif;
            text-align: center;
            padding: 20px;
            white-space: pre-wrap;
            position: relative;
            z-index: 2;
        }

        .message-footer {
            margin-top: 40px;
            text-align: center;
            font-style: italic;
            color: #b33951;
            border-top: 2px dashed #f8d7da;
            padding-top: 25px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 24px;
            font-size: 1.1rem;
        }

        .hearts-background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 123, 156, 0.7);
            font-size: 2.5rem;
            animation: float 8s linear infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0;
        }

        .celebration-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .celebration-heart {
            position: absolute;
            color: #ff7b9c;
            font-size: 3rem;
            animation: celebrationFloat 6s ease-out forwards;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 10px rgba(255, 123, 156, 0.7));
        }

        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff7b9c); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 15px #ff7b9c); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px #ff7b9c); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(80px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) rotate(36deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        @keyframes celebrationFloat {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.3);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(85vh) rotate(180deg) scale(1.2);
            }
            40% {
                transform: translateY(50vh) rotate(360deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(720deg) scale(0.8);
                opacity: 0;
            }
        }

        @keyframes floatHeart {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .password-input {
                width: 100%;
                max-width: 300px;
            }
            
            .heart-photo-frame {
                width: 150px;
                height: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Message Secret d'Amour</h1>
            <p class="subtitle">14 Février - Découvrez le message qui vous est destiné</p>
        </div>
        
        <div class="locked-frame" id="locked-frame">
            <div class="frame-header">
                <i class="fas fa-lock lock-icon"></i>
                <h2 class="frame-title">Message Secret Verrouillé</h2>
            </div>
            
            <div id="couple-name-display" class="couple-name"></div>
            
            <div class="password-section">
                <label for="user-password" class="password-label">Entrez le mot de passe :</label>
                <input type="password" id="user-password" class="password-input" placeholder="Mot de passe secret..." autocomplete="off">
                <div>
                    <button id="unlock-btn" class="unlock-btn">
                        <i class="fas fa-key"></i> Déverrouiller
                    </button>
                </div>
                <div id="error-message" class="error-message"></div>
            </div>
        </div>
        
        <div id="unlocked-container" class="unlocked-container">
            <div class="message-area">
                <div class="message-header">
                    <h2 class="message-title">Message d'Amour</h2>
                </div>
                
                <div class="message-content-wrapper">
                    <div id="photo-left" style="display: none;">
                        <div class="heart-photo-frame">
                            <img id="image-left" alt="Photo">
                        </div>
                    </div>
                    
                    <div class="message-content-area">
                        <div class="message-content" id="displayed-message"></div>
                    </div>
                    
                    <div id="photo-right" style="display: none;">
                        <div class="heart-photo-frame">
                            <img id="image-right" alt="Photo">
                        </div>
                    </div>
                </div>
                
                <div class="message-footer">
                    <i class="fas fa-heart" style="color:#ff7b9c;"></i> Joyeuse Saint-Valentin ! <i class="fas fa-heart" style="color:#ff7b9c;"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="hearts-background" id="hearts-bg"></div>
    <div class="celebration-hearts" id="celebration-hearts"></div>

    <script>
        const API_URL = '/api';

        document.addEventListener('DOMContentLoaded', async function() {
            createBackgroundHearts(20);
            
            const urlParams = new URLSearchParams(window.location.search);
            const messageId = urlParams.get('id');
            
            const userPasswordInput = document.getElementById('user-password');
            const unlockBtn = document.getElementById('unlock-btn');
            const errorMessage = document.getElementById('error-message');
            const coupleNameDisplay = document.getElementById('couple-name-display');
            const displayedMessage = document.getElementById('displayed-message');
            const unlockedContainer = document.getElementById('unlocked-container');
            const lockedFrame = document.getElementById('locked-frame');
            
            if (!messageId) {
                showError('Aucun message spécifié');
                disableUnlock();
                return;
            }
            
            // Charger les infos du message
            try {
                const response = await fetch(`${API_URL}/messages/${messageId}`);
                if (!response.ok) {
                    showError('Message non trouvé');
                    disableUnlock();
                    return;
                }
                
                const message = await response.json();
                coupleNameDisplay.textContent = `Pour : ${message.couple_name || 'quelqu\'un de spécial'}`;
                
            } catch (error) {
                showError('Erreur du serveur');
                disableUnlock();
            }
            
            // Déverrouiller
            unlockBtn.addEventListener('click', unlockMessage);
            userPasswordInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') unlockMessage();
            });
            
            async function unlockMessage() {
                const password = userPasswordInput.value;
                
                if (!password) {
                    showError('Veuillez entrer un mot de passe');
                    return;
                }
                
                unlockBtn.disabled = true;
                unlockBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Vérification...';
                
                try {
                    const response = await fetch(`${API_URL}/messages/${messageId}/unlock`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ password })
                    });
                    
                    const data = await response.json();
                    
                    if (!response.ok) {
                        showError('Mot de passe incorrect');
                        userPasswordInput.value = '';
                        userPasswordInput.focus();
                        unlockBtn.disabled = false;
                        unlockBtn.innerHTML = '<i class="fas fa-key"></i> Déverrouiller';
                        return;
                    }
                    
                    // Afficher le message
                    displayedMessage.textContent = data.messageText;
                    
                    if (data.leftImage) {
                        document.getElementById('image-left').style.display = 'block';
                        document.getElementById('image-left').src = data.leftImage;
                    }
                    
                    if (data.rightImage) {
                        document.getElementById('image-right').style.display = 'block';
                        document.getElementById('image-right').src = data.rightImage;
                    }
                    
                    // Animation
                    unlockedContainer.classList.add('active');
                    lockedFrame.style.transform = 'scale(0.95)';
                    lockedFrame.style.opacity = '0.3';
                    lockedFrame.style.pointerEvents = 'none';
                    
                    // Cœurs de célébration
                    createCelebrationHearts(50);
                    createBackgroundHearts(60);
                    
                    unlockBtn.innerHTML = '<i class="fas fa-lock-open"></i> Déverrouillé !';
                    unlockBtn.style.background = 'linear-gradient(to right, #27ae60, #2ecc71)';
                    
                    playSuccessSound();
                    
                } catch (error) {
                    showError('Erreur du serveur');
                    unlockBtn.disabled = false;
                    unlockBtn.innerHTML = '<i class="fas fa-key"></i> Déverrouiller';
                }
            }
            
            function createBackgroundHearts(count) {
                const container = document.getElementById('hearts-bg');
                container.innerHTML = '';
                
                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    heart.innerHTML = '<i class="fas fa-heart"></i>';
                    heart.classList.add('heart');
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 10 + 's';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    container.appendChild(heart);
                }
            }
            
            function createCelebrationHearts(count) {
                const container = document.getElementById('celebration-hearts');
                container.innerHTML = '';
                
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.innerHTML = '<i class="fas fa-heart"></i>';
                        heart.classList.add('celebration-heart');
                        heart.style.left = Math.random() * 100 + '%';
                        heart.style.animationDelay = Math.random() * 0.3 + 's';
                        heart.style.fontSize = (Math.random() * 40 + 30) + 'px';
                        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                        container.appendChild(heart);
                        
                        setTimeout(() => {
                            if (heart.parentNode) heart.remove();
                        }, 7000);
                    }, i * 150);
                }
            }
            
            function playSuccessSound() {
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = audioContext.createOscillator();
                    const gain = audioContext.createGain();
                    
                    osc.connect(gain);
                    gain.connect(audioContext.destination);
                    
                    osc.frequency.setValueAtTime(523.25, audioContext.currentTime);
                    osc.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1);
                    osc.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2);
                    
                    gain.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    osc.start(audioContext.currentTime);
                    osc.stop(audioContext.currentTime + 0.5);
                } catch (e) {}
            }
            
            function showError(text) {
                errorMessage.textContent = text;
                errorMessage.style.opacity = '1';
            }
            
            function disableUnlock() {
                unlockBtn.disabled = true;
                userPasswordInput.disabled = true;
            }
            
            userPasswordInput.focus();
        });
    </script>
</body>
</html>
