<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Secret d'Amour - 14 Février</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ffafbd, #ffc3a0);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
            position: relative;
        }

        .header {
            margin-bottom: 30px;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 4rem;
            color: #b33951;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.15);
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 1.3rem;
            color: #7a2c40;
            font-weight: 300;
        }

        .locked-frame {
            background-color: rgba(255, 255, 255, 0.97);
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(179, 57, 81, 0.35);
            border: 12px solid #f8d7da;
            position: relative;
            margin-bottom: 30px;
            transition: all 0.8s ease;
            backdrop-filter: blur(5px);
        }

        .frame-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        .lock-icon {
            font-size: 3rem;
            color: #b33951;
            margin-right: 20px;
            animation: pulse 2s infinite;
        }

        .frame-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: #b33951;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }

        .couple-name {
            font-size: 1.8rem;
            color: #ff7b9c;
            margin-bottom: 25px;
            font-weight: 700;
            font-family: 'Dancing Script', cursive;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .password-section {
            margin-bottom: 25px;
        }

        .password-label {
            display: block;
            font-size: 1.3rem;
            color: #7a2c40;
            margin-bottom: 20px;
        }

        .password-input {
            width: 350px;
            padding: 18px 25px;
            border: 3px solid #f8d7da;
            border-radius: 60px;
            font-size: 1.2rem;
            text-align: center;
            transition: all 0.3s;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .password-input:focus {
            outline: none;
            border-color: #b33951;
            box-shadow: 0 0 20px rgba(179, 57, 81, 0.3);
            transform: scale(1.02);
        }

        .unlock-btn {
            background: linear-gradient(to right, #b33951, #ff7b9c);
            color: white;
            border: none;
            padding: 18px 50px;
            border-radius: 60px;
            font-size: 1.3rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 25px rgba(179, 57, 81, 0.5);
            display: inline-block;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .unlock-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 30px rgba(179, 57, 81, 0.6);
        }

        .unlock-btn:active {
            transform: translateY(0);
        }

        /* Section du message déverrouillé */
        .unlocked-container {
            display: none;
            margin-top: 40px;
            animation: fadeInUp 1.2s ease;
        }

        .unlocked-container.active {
            display: block;
        }

        .message-area {
            background-color: white;
            border-radius: 25px;
            padding: 50px 40px;
            box-shadow: 0 20px 50px rgba(179, 57, 81, 0.25);
            border: 10px solid #f8d7da;
            position: relative;
            overflow: hidden;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .message-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .message-title {
            font-family: 'Dancing Script', cursive;
            font-size: 3.5rem;
            color: #b33951;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .message-for {
            font-size: 1.8rem;
            color: #ff7b9c;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Conteneur principal avec photos et message */
        .message-content-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px;
            margin: 40px 0;
        }

        @media (max-width: 1100px) {
            .message-content-wrapper {
                flex-direction: column;
                gap: 30px;
            }
        }

        /* Cadres photos en forme de cœur */
        .heart-photo-frame {
            width: 250px;
            height: 250px;
            position: relative;
            animation: floatHeart 4s ease-in-out infinite;
            flex-shrink: 0;
        }

        .heart-photo-frame.left {
            animation-delay: 0s;
        }

        .heart-photo-frame.right {
            animation-delay: 0.5s;
        }

        .heart-shape {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(45deg, #ff7b9c, #ffafbd);
            display: flex;
            justify-content: center;
            align-items: center;
            transform: rotate(-45deg);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 123, 156, 0.4);
        }

        .heart-shape:before,
        .heart-shape:after {
            content: "";
            width: 100%;
            height: 100%;
            background: inherit;
            border-radius: 50%;
            position: absolute;
        }

        .heart-shape:before {
            top: -50%;
            left: 0;
        }

        .heart-shape:after {
            top: 0;
            right: -50%;
        }

        .heart-image {
            width: 85%;
            height: 85%;
            object-fit: cover;
            border-radius: 15px;
            transform: rotate(45deg);
            position: relative;
            z-index: 2;
            border: 5px solid white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .heart-sparkle {
            position: absolute;
            color: white;
            font-size: 2rem;
            z-index: 3;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.7);
            animation: sparkle 2s infinite;
        }

        .heart-sparkle:nth-child(1) { top: 10%; left: 20%; animation-delay: 0s; }
        .heart-sparkle:nth-child(2) { top: 20%; right: 10%; animation-delay: 0.5s; }
        .heart-sparkle:nth-child(3) { bottom: 20%; left: 10%; animation-delay: 1s; }
        .heart-sparkle:nth-child(4) { bottom: 10%; right: 20%; animation-delay: 1.5s; }

        /* Zone du message */
        .message-content-area {
            flex: 1;
            max-width: 600px;
            padding: 30px;
            background: linear-gradient(135deg, #fff5f7, #ffeef1);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 3px solid #ffd1dc;
            position: relative;
            overflow: hidden;
        }

        .message-content {
            font-size: 1.4rem;
            line-height: 1.9;
            color: #5a3a3a;
            font-family: 'Playfair Display', serif;
            text-align: center;
            padding: 20px;
            white-space: pre-wrap;
            position: relative;
            z-index: 2;
        }

        .message-content:before {
            content: '"';
            font-size: 8rem;
            color: rgba(255, 123, 156, 0.1);
            position: absolute;
            top: -40px;
            left: 20px;
            font-family: 'Dancing Script', cursive;
            z-index: 1;
        }

        .message-content:after {
            content: '"';
            font-size: 8rem;
            color: rgba(255, 123, 156, 0.1);
            position: absolute;
            bottom: -80px;
            right: 20px;
            font-family: 'Dancing Script', cursive;
            z-index: 1;
        }

        .message-footer {
            margin-top: 40px;
            text-align: center;
            font-style: italic;
            color: #b33951;
            border-top: 2px dashed #f8d7da;
            padding-top: 25px;
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* Système de cœurs flottants amélioré */
        .hearts-background {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            color: rgba(255, 123, 156, 0.7);
            font-size: 2.5rem;
            animation: float 8s linear infinite;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
            opacity: 0;
        }

        /* Cœurs de célébration */
        .celebration-hearts {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 9999;
        }

        .celebration-heart {
            position: absolute;
            color: #ff7b9c;
            font-size: 3rem;
            animation: celebrationFloat 6s ease-out forwards;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            filter: drop-shadow(0 0 10px rgba(255, 123, 156, 0.7));
        }

        /* Message d'erreur */
        .error-message {
            color: #e74c3c;
            margin-top: 15px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 24px;
            font-size: 1.1rem;
        }

        /* Info message */
        .message-info {
            margin-top: 30px;
            font-size: 1rem;
            color: #8a6d7a;
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.7);
            border-radius: 10px;
        }

        /* Animations améliorées */
        @keyframes pulse {
            0% { transform: scale(1); filter: drop-shadow(0 0 5px #ff7b9c); }
            50% { transform: scale(1.2); filter: drop-shadow(0 0 15px #ff7b9c); }
            100% { transform: scale(1); filter: drop-shadow(0 0 5px #ff7b9c); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(80px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 1;
                transform: translateY(90vh) rotate(36deg) scale(1);
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) rotate(360deg) scale(1);
                opacity: 0;
            }
        }

        @keyframes celebrationFloat {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.3);
                opacity: 0;
                filter: drop-shadow(0 0 5px rgba(255, 123, 156, 0.5));
            }
            10% {
                opacity: 1;
                transform: translateY(85vh) rotate(180deg) scale(1.2);
                filter: drop-shadow(0 0 20px rgba(255, 123, 156, 0.9));
            }
            40% {
                transform: translateY(50vh) rotate(360deg) scale(1);
            }
            90% {
                opacity: 1;
                filter: drop-shadow(0 0 15px rgba(255, 123, 156, 0.7));
            }
            100% {
                transform: translateY(-100px) rotate(720deg) scale(0.8);
                opacity: 0;
                filter: drop-shadow(0 0 5px rgba(255, 123, 156, 0.3));
            }
        }

        @keyframes floatHeart {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        @keyframes sparkle {
            0%, 100% {
                opacity: 0.3;
                transform: scale(0.8);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-10px); }
            20%, 40%, 60%, 80% { transform: translateX(10px); }
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .title {
                font-size: 3.2rem;
            }
            
            .heart-photo-frame {
                width: 200px;
                height: 200px;
            }
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .frame-title {
                font-size: 1.8rem;
            }
            
            .password-input {
                width: 100%;
                max-width: 300px;
                padding: 15px 20px;
            }
            
            .locked-frame {
                padding: 30px 20px;
            }
            
            .heart-photo-frame {
                width: 150px;
                height: 150px;
            }
            
            .message-content {
                font-size: 1.1rem;
                padding: 15px;
            }
            
            .message-title {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            .title {
                font-size: 2rem;
            }
            
            .frame-title {
                font-size: 1.5rem;
            }
            
            .lock-icon {
                font-size: 2rem;
            }
            
            .heart-photo-frame {
                width: 120px;
                height: 120px;
            }
            
            .message-title {
                font-size: 2rem;
            }
            
            .unlock-btn {
                padding: 15px 30px;
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Message Secret d'Amour</h1>
            <p class="subtitle">14 Février - Découvrez le message qui vous est destiné</p>
        </div>
        
        <div class="locked-frame" id="locked-frame">
            <div class="frame-header">
                <i class="fas fa-lock lock-icon"></i>
                <h2 class="frame-title">Message Secret Verrouillé</h2>
            </div>
            
            <div id="couple-name-display" class="couple-name"></div>
            
            <div class="password-section">
                <label for="user-password" class="password-label">Entrez le mot de passe pour découvrir le message :</label>
                <input type="password" id="user-password" class="password-input" placeholder="Mot de passe secret..." autocomplete="off">
                <div>
                    <button id="unlock-btn" class="unlock-btn">
                        <i class="fas fa-key"></i> Déverrouiller le Message
                    </button>
                </div>
                <div id="error-message" class="error-message"></div>
            </div>
        </div>
        
        <div id="unlocked-container" class="unlocked-container">
            <div class="message-area">
                <div class="message-header">
                    <h2 class="message-title">Message d'Amour</h2>
                    <div class="message-for" id="message-for"></div>
                </div>
                
                <div class="message-content-wrapper">
                    <!-- Cadre photo gauche (cœur) -->
                    <div class="heart-photo-frame left" id="heart-frame-left">
                        <div class="heart-shape">
                            <img id="heart-image-left" class="heart-image" alt="Photo gauche">
                            <div class="heart-sparkle">✨</div>
                            <div class="heart-sparkle">✨</div>
                            <div class="heart-sparkle">✨</div>
                            <div class="heart-sparkle">✨</div>
                        </div>
                    </div>
                    
                    <!-- Zone du message -->
                    <div class="message-content-area">
                        <div class="message-content" id="displayed-message">
                            Le message secret apparaîtra ici après déverrouillage...
                        </div>
                    </div>
                    
                    <!-- Cadre photo droite (cœur) -->
                    <div class="heart-photo-frame right" id="heart-frame-right">
                        <div class="heart-shape">
                            <img id="heart-image-right" class="heart-image" alt="Photo droite">
                            <div class="heart-sparkle">✨</div>
                            <div class="heart-sparkle">✨</div>
                            <div class="heart-sparkle">✨</div>
                            <div class="heart-sparkle">✨</div>
                        </div>
                    </div>
                </div>
                
                <div class="message-footer">
                    <i class="fas fa-heart" style="color:#ff7b9c;"></i> Joyeuse Saint-Valentin ! <i class="fas fa-heart" style="color:#ff7b9c;"></i>
                </div>
                
                <div class="message-info">
                    <p>Ce message a été créé avec l'application Messages d'Amour du 14 Février</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Cœurs de fond -->
    <div class="hearts-background" id="hearts-bg"></div>
    
    <!-- Cœurs de célébration -->
    <div class="celebration-hearts" id="celebration-hearts"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Créer des cœurs flottants en arrière-plan
            createBackgroundHearts(20); // Plus de cœurs initialement
            
            // Récupérer l'ID du message depuis l'URL
            const urlParams = new URLSearchParams(window.location.search);
            const messageId = urlParams.get('id');
            
            // Éléments DOM
            const userPasswordInput = document.getElementById('user-password');
            const unlockBtn = document.getElementById('unlock-btn');
            const unlockedContainer = document.getElementById('unlocked-container');
            const displayedMessage = document.getElementById('displayed-message');
            const errorMessage = document.getElementById('error-message');
            const coupleNameDisplay = document.getElementById('couple-name-display');
            const messageFor = document.getElementById('message-for');
            const lockedFrame = document.getElementById('locked-frame');
            const heartFrameLeft = document.getElementById('heart-frame-left');
            const heartFrameRight = document.getElementById('heart-frame-right');
            const heartImageLeft = document.getElementById('heart-image-left');
            const heartImageRight = document.getElementById('heart-image-right');
            
            let currentMessage = null;
            
            // Charger le message correspondant à l'ID
            if (messageId) {
                loadMessage(messageId);
            } else {
                showError('Aucun message spécifié. Vérifiez le lien.');
                disableInputs();
            }
            
            // Créer des cœurs en arrière-plan
            function createBackgroundHearts(count) {
                const container = document.getElementById('hearts-bg');
                container.innerHTML = '';
                
                for (let i = 0; i < count; i++) {
                    const heart = document.createElement('div');
                    heart.innerHTML = '<i class="fas fa-heart"></i>';
                    heart.classList.add('heart');
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = Math.random() * 10 + 's';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    heart.style.color = getRandomHeartColor();
                    container.appendChild(heart);
                }
            }
            
            // Créer des cœurs de célébration
            function createCelebrationHearts(count) {
                const container = document.getElementById('celebration-hearts');
                container.innerHTML = '';
                
                for (let i = 0; i < count; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.innerHTML = '<i class="fas fa-heart"></i>';
                        heart.classList.add('celebration-heart');
                        heart.style.left = Math.random() * 100 + '%';
                        heart.style.animationDelay = Math.random() * 0.3 + 's';
                        heart.style.fontSize = (Math.random() * 40 + 30) + 'px';
                        heart.style.color = getRandomHeartColor();
                        heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                        container.appendChild(heart);
                        
                        // Supprimer après l'animation
                        setTimeout(() => {
                            if (heart.parentNode) {
                                heart.remove();
                            }
                        }, 7000);
                    }, i * 150);
                }
                
                // Continuer à créer des cœurs pendant 10 secondes
                const interval = setInterval(() => {
                    const heart = document.createElement('div');
                    heart.innerHTML = '<i class="fas fa-heart"></i>';
                    heart.classList.add('celebration-heart');
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDelay = '0s';
                    heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
                    heart.style.color = getRandomHeartColor();
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    container.appendChild(heart);
                    
                    setTimeout(() => {
                        if (heart.parentNode) {
                            heart.remove();
                        }
                    }, 6000);
                }, 300);
                
                // Arrêter après 10 secondes
                setTimeout(() => {
                    clearInterval(interval);
                }, 10000);
            }
            
            // Couleurs aléatoires pour les cœurs
            function getRandomHeartColor() {
                const colors = [
                    '#ff7b9c', '#ff9a9e', '#ffafbd', '#ffb6b9',
                    '#f8c8dc', '#ff99ac', '#ffb7c5', '#ffccd2',
                    '#ff9999', '#ffb3ba', '#ffcccc', '#ff6666'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            // Charger le message depuis le stockage
            function loadMessage(id) {
                const messages = JSON.parse(localStorage.getItem('loveMessages') || '[]');
                currentMessage = messages.find(msg => msg.id == id);
                
                if (currentMessage) {
                    // Afficher le nom du couple
                    if (currentMessage.coupleName && currentMessage.coupleName !== 'Anonyme') {
                        coupleNameDisplay.textContent = `Pour : ${currentMessage.coupleName}`;
                        messageFor.textContent = `Pour : ${currentMessage.coupleName}`;
                    } else {
                        coupleNameDisplay.textContent = 'Un message secret vous attend...';
                        messageFor.textContent = 'Pour toi ❤️';
                    }
                    
                    // Mettre à jour le compteur de vues
                    updateViewCount(id);
                    
                    // Pré-afficher les images si elles existent (floues)
                    if (currentMessage.leftImage) {
                        heartImageLeft.src = currentMessage.leftImage;
                        heartFrameLeft.style.display = 'block';
                    } else {
                        heartFrameLeft.style.display = 'none';
                    }
                    
                    if (currentMessage.rightImage) {
                        heartImageRight.src = currentMessage.rightImage;
                        heartFrameRight.style.display = 'block';
                    } else {
                        heartFrameRight.style.display = 'none';
                    }
                } else {
                    showError('Message non trouvé. Le lien peut être incorrect ou le message a été supprimé.');
                    disableInputs();
                }
            }
            
            // Mettre à jour le compteur de vues
            function updateViewCount(messageId) {
                const messages = JSON.parse(localStorage.getItem('loveMessages') || '[]');
                const messageIndex = messages.findIndex(msg => msg.id == messageId);
                
                if (messageIndex !== -1) {
                    messages[messageIndex].views = (messages[messageIndex].views || 0) + 1;
                    localStorage.setItem('loveMessages', JSON.stringify(messages));
                }
            }
            
            // Déverrouiller le message
            unlockBtn.addEventListener('click', unlockMessage);
            userPasswordInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    unlockMessage();
                }
            });
            
            function unlockMessage() {
                if (!currentMessage) {
                    showError('Aucun message à afficher.');
                    return;
                }
                
                const enteredPassword = userPasswordInput.value;
                
                // Vérifier le mot de passe
                if (enteredPassword === currentMessage.password) {
                    // Mot de passe correct
                    errorMessage.style.opacity = '0';
                    errorMessage.textContent = '';
                    
                    // Afficher le message
                    displayedMessage.textContent = currentMessage.message;
                    unlockedContainer.classList.add('active');
                    
                    // Animation du bouton
                    unlockBtn.innerHTML = '<i class="fas fa-lock-open"></i> Message Déverrouillé !';
                    unlockBtn.style.background = 'linear-gradient(to right, #27ae60, #2ecc71)';
                    unlockBtn.disabled = true;
                    
                    // Animation du cadre verrouillé
                    lockedFrame.style.transform = 'scale(0.95)';
                    lockedFrame.style.opacity = '0.3';
                    lockedFrame.style.pointerEvents = 'none';
                    
                    // Cœurs de célébration SPECTACULAIRES
                    createCelebrationHearts(50); // Beaucoup plus de cœurs !
                    
                    // Augmenter les cœurs de fond
                    createBackgroundHearts(60);
                    
                    // Animer les cadres photos
                    if (currentMessage.leftImage || currentMessage.rightImage) {
                        animateHeartFrames();
                    }
                    
                    // Désactiver le champ de mot de passe
                    userPasswordInput.disabled = true;
                    
                    // Jouer un son de succès (optionnel)
                    playSuccessSound();
                    
                } else {
                    // Mot de passe incorrect
                    showError('Mot de passe incorrect. Essayez à nouveau !');
                    
                    // Animation d'erreur
                    userPasswordInput.style.borderColor = '#e74c3c';
                    userPasswordInput.style.animation = 'shake 0.5s';
                    
                    setTimeout(() => {
                        userPasswordInput.style.animation = '';
                    }, 500);
                    
                    // Vider le champ de mot de passe
                    userPasswordInput.value = '';
                    userPasswordInput.focus();
                }
            }
            
            // Animer les cadres en forme de cœur
            function animateHeartFrames() {
                const frames = [heartFrameLeft, heartFrameRight];
                
                frames.forEach((frame, index) => {
                    if (frame.style.display !== 'none') {
                        // Animation d'entrée
                        frame.style.opacity = '0';
                        frame.style.transform = 'scale(0.5) rotate(' + (index === 0 ? '-90deg' : '90deg') + ')';
                        
                        setTimeout(() => {
                            frame.style.transition = 'all 1s cubic-bezier(0.68, -0.55, 0.265, 1.55)';
                            frame.style.opacity = '1';
                            frame.style.transform = 'scale(1) rotate(0deg)';
                        }, 300 * (index + 1));
                        
                        // Animation continue de flottement
                        setTimeout(() => {
                            frame.style.animation = 'floatHeart 4s ease-in-out infinite';
                            frame.style.animationDelay = (index * 0.5) + 's';
                        }, 1000 + (index * 300));
                    }
                });
            }
            
            // Jouer un son de succès
            function playSuccessSound() {
                // Créer un son simple avec l'API Web Audio
                try {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(523.25, audioContext.currentTime); // Do
                    oscillator.frequency.setValueAtTime(659.25, audioContext.currentTime + 0.1); // Mi
                    oscillator.frequency.setValueAtTime(783.99, audioContext.currentTime + 0.2); // Sol
                    
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);
                    
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + 0.5);
                } catch (e) {
                    console.log("Audio non supporté ou désactivé");
                }
            }
            
            // Afficher une erreur
            function showError(text) {
                errorMessage.textContent = text;
                errorMessage.style.opacity = '1';
            }
            
            // Désactiver les inputs
            function disableInputs() {
                unlockBtn.disabled = true;
                userPasswordInput.disabled = true;
                unlockBtn.textContent = 'Message non disponible';
                unlockBtn.style.background = '#95a5a6';
            }
            
            // Focus sur le champ password
            userPasswordInput.focus();
            
            // Ajouter des cœurs flottants périodiquement
            setInterval(() => {
                if (!unlockedContainer.classList.contains('active')) {
                    addFloatingHeart();
                }
            }, 2000);
            
            function addFloatingHeart() {
                const container = document.getElementById('hearts-bg');
                const heart = document.createElement('div');
                heart.innerHTML = '<i class="fas fa-heart"></i>';
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = '0s';
                heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
                heart.style.color = getRandomHeartColor();
                container.appendChild(heart);
                
                // Supprimer après animation
                setTimeout(() => {
                    if (heart.parentNode) {
                        heart.remove();
                    }
                }, 9000);
            }
        });
    </script>
</body>
</html>
